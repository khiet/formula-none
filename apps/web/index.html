<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Formula None</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #app canvas {
        display: block;
      }
      #instrument-panel {
        position: absolute;
        top: 1rem;
        left: 1rem;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font: 1.25rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      [data-instrument="item"] {
        display: inline-block;
        min-width: 4.5em;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 0.25rem;
      }
      [data-instrument="item"][data-item-state="held"] {
        color: #ffcc33;
      }
      [data-instrument="item"][data-item-state="firing"] {
        color: #000;
        background: #ffcc33;
      }
      [data-instrument="countdown"] {
        position: fixed;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 8rem;
        font-weight: bold;
        text-shadow: 0 0 1rem #000;
      }
      [data-kart-labels] {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
      }
      .kart-label {
        padding: 0.1rem 0.4rem;
        border-radius: 0.25rem;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        font: 0.9rem/1 system-ui, sans-serif;
        white-space: nowrap;
      }
      #title-scene,
      #room-scene,
      #results-scene {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        height: 100%;
        color: #fff;
        font: 1.25rem/1.4 system-ui, sans-serif;
      }
      #results-scene ol {
        padding: 0;
        list-style: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #title-scene button,
      #room-scene button,
      #results-scene button {
        padding: 0.5rem 1.5rem;
        font: inherit;
        cursor: pointer;
      }
      #title-scene input {
        padding: 0.5rem 0.75rem;
        font: inherit;
        width: 12ch;
      }
      #title-scene input[name="code"] {
        width: 6ch;
        text-transform: uppercase;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .title-row,
      .room-buttons {
        display: flex;
        gap: 0.5rem;
      }
      #title-scene [data-message] {
        min-height: 1.4em;
        margin: 0;
        color: #ffb347;
      }
      #room-scene [data-room-code] {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.1em;
      }
      #room-scene a {
        color: #9cf;
      }
      #room-scene .players {
        display: grid;
        grid-template-columns: auto auto auto;
        gap: 0.5rem 1rem;
        align-items: center;
        min-width: 24rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #room-scene .players li {
        display: contents;
      }
      #room-scene .livery {
        width: 1.5rem;
        height: 1.5rem;
        border-radius: 50%;
      }
      #room-scene .state {
        color: #bbb;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
