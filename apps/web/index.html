<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Formula None</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #app canvas {
        display: block;
      }
      /* The HUD unit: the Instrument panel and the kart labels scale with the viewport, with a floor so small windows still read. */
      :root {
        --hud: max(0.55rem, 1.5vmin);
      }
      /*
       * The Instrument panel (ADR 0037): readouts on plates over the View,
       * values white and labels grey in the pixel face, each with an ink
       * drop. Every colour is a custom property the panel writes from
       * palette.ts. The face is registered by the panel module; the stack
       * after it is the fallback.
       */
      #instrument-panel,
      [data-kart-labels] {
        color: var(--value);
        font-family: "Kenney Mini Square", ui-monospace, SFMono-Regular, Menlo, monospace;
        line-height: 1;
        text-transform: uppercase;
        text-shadow: 0.1em 0.1em 0 var(--ink);
      }
      #instrument-panel {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #instrument-panel [hidden] {
        display: none;
      }
      #instrument-panel [data-label] {
        color: var(--label);
        font-size: 0.75em;
      }
      /*
       * A plate (GLOSSARY): chamfered corners and three bands of the tones
       * the panel writes as --plate-lit, --plate and --plate-shaded. The
       * face is drawn behind the readout and clipped there, so the drop,
       * which a clip on the readout itself would cut, follows the chamfer.
       */
      [data-plate] {
        --chamfer: calc(var(--hud) * 0.9);
        position: relative;
        isolation: isolate;
        display: flex;
        align-items: center;
        gap: 0.6em;
        padding: 0.45em 0.8em;
        white-space: nowrap;
        filter: drop-shadow(
          calc(var(--hud) * 0.5) calc(var(--hud) * 0.5) 0
            color-mix(in srgb, var(--ink) 55%, transparent)
        );
      }
      [data-plate]::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        clip-path: polygon(
          var(--chamfer) 0,
          calc(100% - var(--chamfer)) 0,
          100% var(--chamfer),
          100% calc(100% - var(--chamfer)),
          calc(100% - var(--chamfer)) 100%,
          var(--chamfer) 100%,
          0 calc(100% - var(--chamfer)),
          0 var(--chamfer)
        );
        background: linear-gradient(
          var(--plate-lit) 0 34%,
          var(--plate) 34% 70%,
          var(--plate-shaded) 70%
        );
      }
      /* A regular octagon: a start light. */
      [data-plate="octagon"] {
        --chamfer: 29.3%;
      }
      /* Faceted drawings name a face's tone; the state around them picks the colour. */
      [data-tone="0"] {
        fill: var(--lit);
        stroke: var(--lit);
      }
      [data-tone="1"] {
        fill: var(--mid);
        stroke: var(--mid);
      }
      [data-tone="2"] {
        fill: var(--shaded);
        stroke: var(--shaded);
      }
      #instrument-panel [data-stack] {
        position: absolute;
        top: calc(var(--hud) * 2);
        left: calc(var(--hud) * 2);
        display: grid;
        gap: calc(var(--hud) * 1.3);
        justify-items: start;
      }
      [data-instrument="position"] {
        gap: 0;
        padding: 0.12em 0.3em;
        font-size: calc(var(--hud) * 5.6);
      }
      [data-instrument="position"] [data-suffix] {
        align-self: flex-start;
        margin-top: 0.3em;
        font-size: 0.4em;
      }
      [data-instrument="lap"],
      [data-instrument="lap-time"] {
        font-size: calc(var(--hud) * 2.2);
      }
      [data-instrument="best-lap"] {
        font-size: calc(var(--hud) * 1.7);
      }
      /* One cell per figure, the face's digit advance, so the clocks keep their width. */
      [data-instrument="lap-time"] [data-figure],
      [data-instrument="best-lap"] [data-figure] {
        display: inline-block;
        width: 0.625em;
        text-align: center;
      }
      /* Text kept for assistive technology behind the flags and the item's character. */
      [data-lap-text],
      [data-item-name] {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      [data-flags] {
        display: flex;
        align-items: center;
        gap: 0.25em;
      }
      [data-flags]::before {
        content: "LAP";
        margin-right: 0.35em;
        color: var(--label);
        font-size: 0.75em;
      }
      [data-flag] {
        display: block;
        width: 1.3em;
        height: 1.3em;
      }
      [data-flag="todo"] [data-fold="done"],
      [data-flag="done"] [data-fold="todo"] {
        display: none;
      }
      /* The slot is the item box seen face on; its character fills most of it. */
      [data-instrument="item"] {
        --chamfer: calc(var(--hud) * 2.2);
        justify-content: center;
        width: calc(var(--hud) * 9.9);
        height: calc(var(--hud) * 9.9);
        padding: 0;
        font-size: calc(var(--hud) * 1.6);
      }
      [data-instrument="item"] svg {
        width: 88%;
        height: auto;
      }
      /*
       * The reel: a strip of the items scrolled up through the slot, one
       * slot-high cell per icon, so the panel scrolls it by a percentage
       * of its own height.
       */
      [data-instrument="item"] {
        overflow: hidden;
      }
      [data-item-reel] {
        position: absolute;
        inset: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        will-change: transform;
      }
      [data-item-reel] svg {
        flex: none;
        height: calc(var(--hud) * 9.9);
      }
      /* The landing: the icon swells and settles, once. */
      [data-instrument="item"] svg[data-landed] {
        animation: item-pop 0.38s ease-out;
      }
      @keyframes item-pop {
        35% {
          transform: scale(1.4);
        }
        65% {
          transform: scale(0.92);
        }
      }
      /*
       * The star's ring (ADR 0075): round the slot through the own kart's
       * run, its rainbow stroke shortening as the seconds run out. Outside
       * the plate, so its chamfer and the reel's clip leave the ring whole.
       */
      [data-item-with-ring] {
        position: relative;
        display: grid;
        width: max-content;
      }
      [data-star-ring] {
        position: absolute;
        inset: calc(var(--hud) * -0.8);
        width: auto;
        height: auto;
        pointer-events: none;
        overflow: visible;
      }
      /*
       * The drone warning's marker (ADR 0076): the drone's red eye to the
       * right of the slot, toward the road, blinking while a drone chasing
       * the own kart is within the warning distance; steady under reduced
       * motion.
       */
      [data-drone-warning] {
        position: absolute;
        left: calc(100% + var(--hud) * 1.2);
        top: 50%;
        width: calc(var(--hud) * 4.2);
        height: calc(var(--hud) * 4.2);
        transform: translateY(-50%);
        animation: drone-warning 0.35s steps(1, end) infinite;
      }
      [data-drone-warning][hidden] {
        display: none;
      }
      [data-drone-warning] svg {
        width: 100%;
        height: 100%;
      }
      @keyframes drone-warning {
        50%,
        100% {
          opacity: 0.35;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        [data-drone-warning] {
          animation: none;
        }
      }
      /* Firing lights the plate, flashing back to the box's gold. */
      [data-instrument="item"][data-item-state="firing"] {
        animation: item-fire 0.25s steps(1, end) infinite;
      }
      /* Each flash holds one state for its first half and the other for its second, never a mix. */
      @keyframes item-fire {
        50%,
        100% {
          --plate-lit: var(--gold-lit);
          --plate: var(--gold);
          --plate-shaded: var(--gold-shaded);
        }
      }
      /*
       * The speed cluster (ADR 0031), bottom-left opposite the course map:
       * the coin count over the shift lights, the gear on its plate under
       * them, km/h beside it and the tyre gauge under that.
       */
      #instrument-panel [data-cluster] {
        position: absolute;
        left: calc(var(--hud) * 2);
        bottom: calc(var(--hud) * 2);
        display: grid;
        grid-template-areas: "coins coins" "lights lights" "gear speed" "gear tyre";
        grid-template-columns: auto auto;
        column-gap: calc(var(--hud) * 1.4);
        row-gap: calc(var(--hud) * 0.9);
        align-items: end;
      }
      [data-shift-lights] {
        grid-area: lights;
        width: calc(var(--hud) * 21);
        height: auto;
        filter: drop-shadow(
          calc(var(--hud) * 0.3) calc(var(--hud) * 0.3) 0
            color-mix(in srgb, var(--ink) 55%, transparent)
        );
      }
      [data-shift-light] {
        --lit: var(--carbon-lit);
        --mid: var(--carbon);
        --shaded: var(--carbon-shaded);
      }
      [data-shift-light="green"],
      [data-tyre-wear="good"] [data-tyre-corner] {
        --lit: var(--green-lit);
        --mid: var(--green);
        --shaded: var(--green-shaded);
      }
      [data-shift-light="red"],
      [data-tyre-wear="bad"] [data-tyre-corner] {
        --lit: var(--red-lit);
        --mid: var(--red);
        --shaded: var(--red-shaded);
      }
      [data-shift-light="blue"] {
        --lit: var(--blue-lit);
        --mid: var(--blue);
        --shaded: var(--blue-shaded);
      }
      [data-tyre-wear="warn"] [data-tyre-corner] {
        --lit: var(--yellow-lit);
        --mid: var(--yellow);
        --shaded: var(--yellow-shaded);
      }
      [data-instrument="gear"] {
        --chamfer: calc(var(--hud) * 1.6);
        grid-area: gear;
        justify-content: center;
        width: 1.2em;
        height: 1.35em;
        padding: 0;
        font-size: calc(var(--hud) * 7);
      }
      /* In the pit lane the slot reads PIT on a white plate of the same size, in smaller type to fit. */
      [data-instrument="gear"][data-pit="true"] {
        width: calc(var(--hud) * 8.4);
        height: calc(var(--hud) * 9.45);
        font-size: calc(var(--hud) * 3.4);
        color: var(--ink);
        text-shadow: none;
      }
      /* On the limiter the gear turns white and flashes back to carbon. */
      [data-instrument="gear"][data-limiter="true"] {
        color: var(--ink);
        text-shadow: none;
        animation: limiter 0.12s steps(1, end) infinite;
      }
      @keyframes limiter {
        50%,
        100% {
          --plate-lit: var(--carbon-lit);
          --plate: var(--carbon);
          --plate-shaded: var(--carbon-shaded);
          color: var(--value);
        }
      }
      [data-instrument="speed"] {
        grid-area: speed;
        display: flex;
        align-items: baseline;
        gap: calc(var(--hud) * 0.8);
      }
      [data-speed-value] {
        min-width: 3ch;
        font-size: calc(var(--hud) * 5.2);
        text-align: right;
      }
      [data-speed-unit] {
        font-size: calc(var(--hud) * 1.8);
        color: var(--label);
      }
      [data-instrument="tyre"] {
        grid-area: tyre;
        display: flex;
        align-items: center;
        gap: calc(var(--hud) * 1);
        font-size: calc(var(--hud) * 2.2);
      }
      [data-instrument="tyre"] svg {
        width: calc(var(--hud) * 3.6);
        filter: drop-shadow(
          calc(var(--hud) * 0.3) calc(var(--hud) * 0.3) 0
            color-mix(in srgb, var(--ink) 55%, transparent)
        );
      }
      /* The stop readout stands over the BOX plate's spot, off the cluster's
         right edge: the crew's clock counting up, then the final time on a
         plate in the roll's colour. Light plates take ink type. */
      [data-instrument="stop"] {
        position: absolute;
        left: calc(100% + var(--hud) * 1);
        bottom: calc(var(--hud) * 5);
        display: flex;
        align-items: baseline;
        gap: calc(var(--hud) * 0.8);
        padding: 0.2em 0.5em;
        font-size: calc(var(--hud) * 2.6);
        white-space: nowrap;
      }
      [data-stop-label] {
        font-size: 0.7em;
        color: var(--label);
      }
      [data-instrument="stop"][data-stop="record"],
      [data-instrument="stop"][data-stop="clean"],
      [data-instrument="stop"][data-stop="slow"] {
        color: var(--ink);
        text-shadow: none;
      }
      [data-instrument="stop"][data-stop="record"] [data-stop-label],
      [data-instrument="stop"][data-stop="clean"] [data-stop-label],
      [data-instrument="stop"][data-stop="slow"] [data-stop-label] {
        color: var(--ink);
      }
      /* Off the cluster's right edge, level with the tyre gauge it warns of. */
      [data-instrument="box-call"] {
        position: absolute;
        left: calc(100% + var(--hud) * 1);
        bottom: 0;
        padding: 0.2em 0.5em;
        font-size: calc(var(--hud) * 2.6);
      }
      /* Over the spot the BOX and STOP plates take, clear of either: rain can arrive through a stop. */
      [data-instrument="rain"] {
        position: absolute;
        left: calc(100% + var(--hud) * 1);
        bottom: calc(var(--hud) * 9.6);
        padding: 0.2em 0.5em;
        font-size: calc(var(--hud) * 2.6);
      }
      [data-instrument="coins"] {
        grid-area: coins;
        display: flex;
        align-items: center;
        gap: calc(var(--hud) * 1);
        font-size: calc(var(--hud) * 2.6);
      }
      [data-instrument="coins"] svg {
        width: calc(var(--hud) * 2.8);
        filter: drop-shadow(
          calc(var(--hud) * 0.3) calc(var(--hud) * 0.3) 0
            color-mix(in srgb, var(--ink) 55%, transparent)
        );
      }
      /* Greybox readouts: a dim line of their own, top-right, clear of the course map and the countdown (ADR 0031). */
      #instrument-panel [data-greybox] {
        position: absolute;
        right: calc(var(--hud) * 2);
        top: calc(var(--hud) * 2);
        font-size: calc(var(--hud) * 1.2);
        color: rgb(255 255 255 / 0.55);
        text-transform: none;
        text-shadow: 0.125em 0.125em 0 var(--ink);
      }
      [data-instrument="wrong-way"] {
        position: absolute;
        top: 56%;
        left: 50%;
        transform: translateX(-50%);
        padding: 0.3em 0.5em;
        font-size: calc(var(--hud) * 4.2);
        animation: blink 0.6s steps(2) infinite;
      }
      @keyframes blink {
        to {
          visibility: hidden;
        }
      }
      [data-instrument="connection-banner"] {
        position: absolute;
        top: calc(var(--hud) * 2);
        left: 50%;
        transform: translateX(-50%);
        padding: 0.6em 1em;
        font-size: calc(var(--hud) * 1.8);
      }
      [data-instrument="countdown"] {
        position: fixed;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 0.3em 0.45em;
        font-size: calc(var(--hud) * 6);
      }
      /* The start lights: a row of lamps, no plate behind them. */
      [data-instrument="countdown"]:not([data-plate]) {
        display: flex;
        gap: var(--hud);
        padding: 0;
      }
      /* GO is ink on the green, lifted by a pale drop. */
      [data-instrument="countdown"][data-plate] {
        color: var(--ink);
        text-shadow: 0.1em 0.1em 0 color-mix(in srgb, var(--value) 50%, transparent);
      }
      [data-lamp] {
        width: calc(var(--hud) * 5);
        height: calc(var(--hud) * 5);
        padding: 0;
      }
      [data-lamp="lit"] {
        --plate-lit: var(--poster-red-lit);
        --plate: var(--poster-red);
        --plate-shaded: var(--poster-red-shaded);
      }
      /* An unlit lamp sits back: no drop, so the lit ones stand off the View. */
      [data-lamp="off"] {
        --plate-lit: var(--lamp-off-lit);
        --plate: var(--lamp-off);
        --plate-shaded: var(--lamp-off-shaded);
        filter: none;
      }
      [data-instrument="finish"] {
        position: fixed;
        top: 30%;
        left: 50%;
        transform: translate(-50%, -50%);
        gap: 0.35em;
        padding: 0.25em 0.35em;
        font-size: calc(var(--hud) * 7);
      }
      /* The track's chequer at both ends of FINISH. */
      [data-chequer] {
        width: 0.6em;
        height: 1em;
        background: conic-gradient(
            var(--ink) 25%,
            var(--value) 0 50%,
            var(--ink) 0 75%,
            var(--value) 0
          )
          0 0 / 0.3em 0.25em;
      }
      [data-instrument="standings"] {
        position: fixed;
        top: 42%;
        left: 50%;
        transform: translateX(-50%);
        display: grid;
        gap: 0.35em;
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: calc(var(--hud) * 1.8);
      }
      [data-instrument="standings"] li {
        padding: 0.35em 0.7em;
      }
      [data-instrument="standings"] li[data-own] {
        color: var(--ink);
        text-shadow: none;
      }
      [data-instrument="standings"] b {
        width: 2.4em;
        font-weight: normal;
      }
      [data-chip] {
        display: inline-flex;
        width: 1.5em;
        height: 0.95em;
        overflow: hidden;
      }
      [data-chip] i {
        flex: 1;
      }
      /* The warning, the firing flash and the limiter hold steady for a driver who asked for less motion. */
      @media (prefers-reduced-motion: reduce) {
        [data-instrument="wrong-way"],
        [data-instrument="item"][data-item-state="firing"],
        [data-instrument="gear"][data-limiter="true"] {
          animation: none;
        }
      }
      [data-instrument="course-map"] {
        position: fixed;
        right: calc(var(--hud) * 2);
        bottom: calc(var(--hud) * 2);
        width: 25vmin;
        height: 25vmin;
        pointer-events: none;
      }
      [data-kart-labels] {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
      }
      /* A name on a plate in the kart's key colour, with a pointer down to the kart. */
      .kart-label {
        --chamfer: calc(var(--hud) * 0.6);
        padding: 0.3em 0.55em;
        font-size: calc(var(--hud) * 2);
      }
      /* A star kart's plate is underlined in the shine, so the others see it coming (ADR 0075). */
      .kart-label[data-star] {
        box-shadow: 0 0.25em 0 var(--star);
      }
      .kart-label::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        width: 0.9em;
        height: 0.5em;
        translate: -50% -1px;
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        background: var(--plate-shaded);
      }
      /*
       * The Title, Room and Results Scenes as a Grand Prix poster, design A of
       * docs/mockups/title-and-results-variations.html, set in the
       * Instrument panel's face. One em, 1% of the window's width capped at
       * 1.6% of its height, scales the whole poster; it is clean down to
       * 1024x640.
       */
      #title-scene,
      #room-scene,
      #results-scene {
        --ink: #111;
        --gold: #ffd23f;
        --go: #3ddc84;
        position: relative;
        box-sizing: border-box;
        height: 100%;
        overflow: hidden;
        isolation: isolate;
        color: #fff;
        background: #c81d25;
        font-family: "Kenney Mini Square", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: min(1vw, 1.6vh);
        line-height: 1.2;
        text-transform: uppercase;
      }
      :is(#title-scene, #room-scene, #results-scene) * {
        box-sizing: border-box;
      }
      :is(#title-scene, #room-scene, #results-scene) :is(h1, p) {
        margin: 0;
        font-weight: normal;
      }
      :is(#title-scene, #room-scene, #results-scene) .rays {
        position: absolute;
        z-index: -1;
        left: 50%;
        top: 40%;
        width: 160em;
        aspect-ratio: 1;
        translate: -50% -50%;
        border-radius: 50%;
        background: repeating-conic-gradient(rgb(255 210 60 / 0.18) 0 8deg, transparent 8deg 16deg);
      }
      :is(#title-scene, #room-scene, #results-scene) :is(.chequer-top, .chequer-bottom) {
        position: absolute;
        z-index: 1;
        left: 0;
        right: 0;
        height: 3em;
        background: conic-gradient(var(--ink) 25%, #fff 0 50%, var(--ink) 0 75%, #fff 0) 0 0 / 3em 3em;
      }
      :is(#title-scene, #room-scene, #results-scene) .chequer-top {
        top: 0;
      }
      :is(#title-scene, #room-scene, #results-scene) .chequer-bottom {
        bottom: 0;
      }
      :is(#title-scene, #room-scene, #results-scene) .kart {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }
      /* Each wheel turns about its axle, which poster.ts sets as its origin in viewBox units, as the View turns the kart's. */
      :is(#title-scene, #room-scene, #results-scene) .kart .wheel {
        transform-box: view-box;
      }
      /* The lit and shaded tones of the colours poster.ts sets on each kart: the livery's, the driver's and build.py's fixed ones. */
      :is(#title-scene, #room-scene, #results-scene) .kart {
        --p-lt: color-mix(in srgb, var(--p) 72%, white);
        --p-dk: color-mix(in srgb, var(--p) 66%, black);
        --s-lt: color-mix(in srgb, var(--s) 78%, white);
        --s-dk: color-mix(in srgb, var(--s) 82%, black);
        --a-lt: color-mix(in srgb, var(--a) 72%, white);
        --a-dk: color-mix(in srgb, var(--a) 66%, black);
        --sk-lt: color-mix(in srgb, var(--sk) 80%, white);
        --sk-dk: color-mix(in srgb, var(--sk) 80%, black);
        --hair-lt: color-mix(in srgb, var(--hair) 78%, white);
        --hair-dk: color-mix(in srgb, var(--hair) 70%, black);
        --tyre-lt: color-mix(in srgb, var(--tyre) 72%, white);
        --tyre-dk: color-mix(in srgb, var(--tyre) 66%, black);
        --rim-lt: color-mix(in srgb, var(--rim) 72%, white);
        --rim-dk: color-mix(in srgb, var(--rim) 66%, black);
        --carbon-lt: color-mix(in srgb, var(--carbon) 72%, white);
        --carbon-dk: color-mix(in srgb, var(--carbon) 66%, black);
        --whites-lt: color-mix(in srgb, var(--whites) 72%, white);
        --whites-dk: color-mix(in srgb, var(--whites) 66%, black);
        --irises-lt: color-mix(in srgb, var(--irises) 72%, white);
        --irises-dk: color-mix(in srgb, var(--irises) 66%, black);
        --gold-lt: color-mix(in srgb, var(--gold) 72%, white);
        --gold-dk: color-mix(in srgb, var(--gold) 66%, black);
        --grey-lt: color-mix(in srgb, var(--grey) 72%, white);
        --grey-dk: color-mix(in srgb, var(--grey) 66%, black);
        --mouth-lt: color-mix(in srgb, var(--mouth) 72%, white);
        --mouth-dk: color-mix(in srgb, var(--mouth) 66%, black);
      }
      /* Chunky buttons with hard shadows that press in; the way forward is green. */
      :is(#title-scene, #room-scene, #results-scene) button {
        padding: 0.5em 1em;
        font: inherit;
        font-size: 1.8em;
        color: var(--ink);
        text-transform: uppercase;
        background: var(--gold);
        border: 0.2em solid var(--ink);
        box-shadow: 0.3em 0.3em 0 var(--ink);
        cursor: pointer;
      }
      :is(#title-scene, #room-scene, #results-scene) button:hover {
        background: #ffe27a;
        translate: -0.08em -0.08em;
        box-shadow: 0.38em 0.38em 0 var(--ink);
      }
      :is(#title-scene, #room-scene, #results-scene) button:active {
        translate: 0.3em 0.3em;
        box-shadow: 0 0 0 var(--ink);
      }
      :is(#title-scene, #room-scene, #results-scene) :is(button, input):focus-visible {
        outline: 0.15em solid #fff;
        outline-offset: 0.15em;
      }
      #title-scene button[name="create"],
      #room-scene button[name="start"],
      #results-scene button[name="rematch"] {
        background: var(--go);
      }
      #title-scene button[name="create"]:hover,
      #room-scene button[name="start"]:not(:disabled):hover,
      #results-scene button[name="rematch"]:hover {
        background: #8ef0b7;
      }
      /* Title: the way in on the left, the course on the right (ADR 0061). */
      #title-scene {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        padding: 4em 5em;
      }
      #title-scene .way-in {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.4em;
      }
      #title-scene .course {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.2em;
      }
      #title-scene .course-heading {
        display: flex;
        align-items: baseline;
        gap: 0.8em;
        rotate: -2deg;
      }
      #title-scene .course-heading h2 {
        margin: 0;
        font: inherit;
        font-size: 3em;
        text-shadow: 0.08em 0.08em 0 var(--ink);
      }
      #title-scene .course-heading p {
        padding: 0.35em 0.6em;
        font-size: 1.2em;
        background: var(--ink);
      }
      /* The flags as a radio group: the arrows move between them, as a native radio's do. */
      #title-scene .flags {
        display: flex;
        gap: 1.4em;
        margin: 0;
        padding: 0;
        border: 0;
      }
      #title-scene .flag-tile {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5em;
        padding: 0.6em;
        background: var(--ink);
        box-shadow: 0.3em 0.3em 0 rgb(0 0 0 / 0.4);
        cursor: pointer;
      }
      #title-scene .flag-tile:hover {
        translate: -0.08em -0.08em;
      }
      #title-scene .flag-tile input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      #title-scene .flag-tile [data-flag] {
        display: block;
        width: 8.4em;
        height: 5.6em;
        border: 0.2em solid var(--ink);
      }
      #title-scene .flag-name {
        font-size: 1.3em;
      }
      #title-scene .flag-tile:has(input:checked) {
        background: var(--gold);
        color: var(--ink);
        translate: -0.15em -0.15em;
        box-shadow: 0.45em 0.45em 0 var(--ink);
      }
      #title-scene .flag-tile:has(input:not(:checked)) [data-flag] {
        filter: saturate(0.55) brightness(0.8);
      }
      #title-scene .flag-tile:has(input:focus-visible) {
        outline: 0.15em solid #fff;
        outline-offset: 0.15em;
      }
      /* The bot level, the Tyres pick, the laps and the Weather pick under the flags (ADR 0078, ADR 0083, ADR 0084, ADR 0103): a tile per choice, the flag tile with the caption in the flag's place. */
      /* The picks side by side, as wide as the preview under them, so a new pick does not push it off the poster. */
      #title-scene .picks {
        display: grid;
        grid-template-columns: auto auto auto auto;
        gap: 0.6em;
        width: 38em;
      }
      #title-scene .bots {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.7em;
        margin: 0;
        padding: 0;
        border: 0;
      }
      #title-scene .bots h2 {
        margin: 0;
        font: inherit;
        font-size: 1.8em;
        text-shadow: 0.08em 0.08em 0 var(--ink);
        rotate: -2deg;
      }
      #title-scene .bot-tiles {
        display: flex;
        gap: 0.4em;
      }
      #title-scene .bot-tile {
        padding: 0.45em 0.5em;
        white-space: nowrap;
      }
      #title-scene :is([data-bots-blurb], [data-tyres-blurb], [data-weather-blurb]) {
        /* The tiles set the column's width, so a long line wraps rather than pushing the row wider. */
        width: 0;
        min-width: 100%;
        margin: 0;
        padding: 0.35em 0.5em;
        font-size: 1em;
        text-align: center;
        background: var(--ink);
      }
      #room-scene .room-pick {
        margin: 0.6em 0 0;
        padding: 0.35em 0.6em;
        font-size: 1.3em;
        text-align: center;
        background: var(--ink);
      }
      :is(#title-scene, #room-scene) .preview {
        width: 38em;
        padding: 1.2em 1.4em 1.3em;
        background: var(--ink);
        box-shadow: 0.4em 0.4em 0 rgb(0 0 0 / 0.4);
      }
      :is(#title-scene, #room-scene) .preview-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1em;
      }
      :is(#title-scene, #room-scene) .preview h3 {
        margin: 0;
        font: inherit;
        font-size: 3em;
        color: var(--gold);
        text-shadow: 0.08em 0.08em 0 #000;
      }
      :is(#title-scene, #room-scene) .preview .after {
        font-size: 1.3em;
        color: #c9ced5;
      }
      :is(#title-scene, #room-scene) .preview .map {
        display: block;
        width: 100%;
        height: 19em;
        margin: 0.8em 0;
        background: #1b1d21;
      }
      /* Sizes down on the Title, so the picks' lines leave the card's numbers on the poster. */
      #title-scene .preview .map {
        height: 12.5em;
      }
      :is(#title-scene, #room-scene) .preview .blurb {
        font-size: 1.3em;
      }
      :is(#title-scene, #room-scene) .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.6em;
        margin-top: 0.8em;
      }
      :is(#title-scene, #room-scene) .stats div {
        display: flex;
        flex-direction: column;
        gap: 0.25em;
        padding: 0.5em 0.6em;
        background: #2b2e33;
      }
      :is(#title-scene, #room-scene) .stats b {
        font-weight: normal;
        font-size: 1.8em;
      }
      :is(#title-scene, #room-scene) .stats small {
        font-size: 1em;
        color: #c9ced5;
      }
      @media (prefers-reduced-motion: no-preference) {
        :is(#title-scene, #room-scene) .map-swap {
          animation: map-in 0.25s ease-out;
        }
      }
      @keyframes map-in {
        from {
          opacity: 0;
          translate: 0 0.6em;
        }
      }
      #title-scene .logo {
        position: relative;
        rotate: -4deg;
        text-align: center;
      }
      #title-scene h1 {
        font-size: 6.4em;
        line-height: 0.95;
        letter-spacing: 0.02em;
      }
      #title-scene h1 span {
        display: block;
        text-shadow: 0.08em 0.08em 0 var(--ink);
      }
      #title-scene h1 span:first-child {
        color: var(--gold);
        text-shadow:
          0.08em 0.08em 0 var(--ink),
          0.16em 0.16em 0 rgb(0 0 0 / 0.35);
      }
      /* The crossed-out "1", stuck on at the top-right of NONE. */
      #title-scene .one {
        position: absolute;
        left: calc(50% + 3.6em);
        top: 1.9em;
        padding: 0.1em 0.25em;
        font-size: 2.9em;
        color: var(--ink);
        background: var(--gold);
        border: 0.12em solid var(--ink);
        rotate: 14deg;
        text-decoration-thickness: 0.18em;
        text-decoration-color: #c81d25;
      }
      #title-scene .tagline {
        margin-top: -0.4em;
        padding: 0.5em 1em;
        font-size: 1.4em;
        letter-spacing: 0.06em;
        background: var(--ink);
        rotate: -4deg;
      }
      .title-row {
        display: flex;
        gap: 1em;
      }
      #title-scene input:not([type="checkbox"], [type="radio"]) {
        width: 11em;
        padding: 0.45em 0.6em;
        font: inherit;
        font-size: 1.8em;
        color: var(--ink);
        text-transform: none;
        background: #fff;
        border: 0.2em solid var(--ink);
        box-shadow: 0.3em 0.3em 0 var(--ink);
        outline: none;
      }
      #title-scene input:not([type="checkbox"], [type="radio"]):focus {
        background: #fff6cf;
      }
      #title-scene input::placeholder {
        color: #888;
      }
      #title-scene input[name="code"] {
        width: 6em;
        letter-spacing: 0.3em;
        text-align: center;
        text-transform: uppercase;
      }
      /* The audio toggles as chips: a lit square when on, the label struck through when off. */
      #title-scene .audio-toggles {
        gap: 1em;
      }
      #title-scene .chip {
        display: flex;
        align-items: center;
        gap: 0.5em;
        padding: 0.5em 0.8em;
        font-size: 1.3em;
        background: var(--ink);
        cursor: pointer;
      }
      #title-scene .chip:focus-within {
        outline: 0.12em solid #fff;
      }
      #title-scene .chip input {
        appearance: none;
        width: 1em;
        height: 1em;
        margin: 0;
        background: #555;
        cursor: pointer;
      }
      #title-scene .chip input:checked {
        background: var(--go);
        box-shadow: 0 0 0.6em var(--go);
      }
      #title-scene .chip input:not(:checked) + span {
        opacity: 0.5;
        text-decoration: line-through;
      }
      #title-scene [data-message] {
        min-height: 1.2em;
        font-size: 1.4em;
        color: var(--gold);
        text-transform: none;
      }
      #title-scene .runner {
        position: absolute;
        z-index: 1;
        bottom: 3.6em;
        left: -12em;
        width: 10em;
      }
      #title-scene .runner + .runner {
        bottom: 4.4em;
        width: 8em;
      }
      /*
       * Room: the code and count over the link to share, the grid, then the
       * status and the buttons; the room's course card in a column beside
       * them (ADR 0062), or under the grid on a window taller than it is wide.
       */
      #room-scene {
        display: grid;
        grid-template-columns: auto;
        grid-template-areas: "header" "share" "players" "status" "buttons";
        place-content: center;
        justify-items: center;
        row-gap: 1.6em;
        column-gap: 3em;
        padding: 4.5em 2em;
      }
      #room-scene:has([data-room-course]) {
        grid-template-columns: auto auto;
        grid-template-areas:
          "header course" "share course" "players course" "status course"
          "buttons course";
      }
      @media (max-aspect-ratio: 1/1) {
        #room-scene:has([data-room-course]) {
          grid-template-columns: auto;
          grid-template-areas: "header" "share" "players" "course" "status" "buttons";
        }
      }
      /* The card is the Title's, a size down, so it fits beside the grid. */
      #room-scene [data-room-course] {
        grid-area: course;
        align-self: center;
        font-size: 0.8em;
      }
      #room-scene > header {
        grid-area: header;
        display: flex;
        align-items: center;
        gap: 0.8em;
        rotate: -3deg;
      }
      #room-scene h1 {
        font-size: 5em;
        text-shadow: 0.08em 0.08em 0 var(--ink);
      }
      #room-scene [data-room-code] {
        color: var(--gold);
        letter-spacing: 0.08em;
      }
      #room-scene [data-room-count] {
        padding: 0.3em 0.6em;
        font-size: 1.8em;
        color: var(--ink);
        background: var(--gold);
        border: 0.15em solid var(--ink);
      }
      #room-scene .share {
        grid-area: share;
        display: flex;
        align-items: center;
        gap: 1em;
        padding: 0.5em 0.5em 0.5em 1em;
        background: var(--ink);
        box-shadow: 0.4em 0.4em 0 rgb(0 0 0 / 0.4);
      }
      #room-scene [data-room-link] {
        font-size: 1.4em;
        color: #fff;
        text-transform: none;
        user-select: all;
      }
      #room-scene button[name="copy"] {
        padding: 0.35em 0.6em;
        font-size: 1.2em;
        border-width: 0.15em;
        box-shadow: 0.2em 0.2em 0 #000;
      }
      /* Two staggered columns like a starting grid: players fill left, right, left, right in list order. */
      #room-scene .players {
        grid-area: players;
        display: grid;
        grid-template-columns: repeat(2, 34em);
        grid-auto-rows: 7em;
        column-gap: 4em;
        margin: 0;
        padding: 0 0 3.5em;
        list-style: none;
      }
      /* Beside a course card the grid narrows, so both fit side by side. */
      #room-scene:has([data-room-course]) .players {
        grid-template-columns: repeat(2, 30em);
      }
      #room-scene .players li {
        display: grid;
        grid-template-areas: "kart name name" "kart badges state";
        grid-template-columns: 9em auto 1fr;
        align-items: center;
        column-gap: 1em;
        padding: 0.2em 0.8em 0.2em 0.4em;
        border-left: 0.3em solid #fff;
        border-bottom: 0.15em dashed rgb(255 255 255 / 0.5);
      }
      #room-scene .players li:nth-child(even) {
        translate: 0 3.5em;
      }
      #room-scene .players .nickname {
        overflow: hidden;
        font-size: 1.8em;
        text-overflow: ellipsis;
        text-transform: none;
        white-space: nowrap;
        text-shadow: 0.08em 0.08em 0 var(--ink);
        grid-area: name;
      }
      #room-scene .players .kart {
        grid-area: kart;
      }
      #room-scene .players .badges {
        grid-area: badges;
        display: flex;
        gap: 0.4em;
      }
      /* The You and Creator badges and the state chip share the Fastest lap badge's look. */
      #results-scene [data-fastest-lap],
      #room-scene [data-badge],
      #room-scene .players .state {
        padding: 0.2em 0.4em;
        color: #fff;
        background: #a45cff;
      }
      #room-scene [data-badge],
      #room-scene .players .state {
        font-size: 1.1em;
      }
      #room-scene [data-badge] .paren {
        display: none;
      }
      #room-scene .players .state {
        grid-area: state;
        justify-self: start;
        margin-left: 0.4em;
        color: #ccc;
        background: var(--ink);
      }
      #room-scene .players li[data-state="ready"] .state {
        color: var(--ink);
        background: var(--go);
      }
      /* Without badges the chip starts under the nickname, in line with every other row's first chip. */
      #room-scene .players .badges:empty + .state {
        grid-column: 2 / -1;
        margin-left: 0;
      }
      #room-scene .players li:is([data-state="joining"], [data-state="disconnected"]) {
        opacity: 0.45;
      }
      #room-scene [data-room-state] {
        grid-area: status;
        padding: 0.4em 0.8em;
        font-size: 1.4em;
        background: var(--ink);
      }
      #room-scene .room-buttons {
        grid-area: buttons;
        display: flex;
        gap: 1em;
      }
      #room-scene button:disabled {
        color: #666;
        background: #aaa;
        box-shadow: none;
        translate: 0.3em 0.3em;
        cursor: not-allowed;
      }
      /* Results: the headline across the top, the podium under it and the board beside that. */
      #results-scene {
        display: grid;
        grid-template-areas: "head head" "podium side";
        grid-template-columns: 44em 40em;
        grid-template-rows: auto 1fr;
        justify-content: center;
        gap: 2em 6em;
        padding: 6em 4em;
      }
      #results-scene header {
        grid-area: head;
        text-align: center;
      }
      #results-scene [data-race-over] {
        display: inline-block;
        padding: 0.3em 0.7em;
        font-size: 1.6em;
        color: var(--ink);
        background: var(--gold);
        border: 0.15em solid var(--ink);
        rotate: -3deg;
      }
      #results-scene h1 {
        margin-top: 0.25em;
        font-size: 4.6em;
        text-shadow: 0.08em 0.08em 0 var(--ink);
      }
      /* From 4th down the place itself is the headline, stamped on. */
      #results-scene h1[data-stamp] {
        display: block;
        width: max-content;
        margin: 0.15em auto 0;
        padding: 0 0.2em;
        font-size: 6.4em;
        color: var(--gold);
        border: 0.08em solid var(--gold);
        rotate: -6deg;
      }
      #results-scene [data-subline] {
        margin-top: 0.6em;
        font-size: 1.4em;
      }
      #results-scene ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #results-scene [data-fastest-lap] {
        font-size: 0.75em;
      }
      #results-scene [data-side] {
        grid-area: side;
        align-self: end;
        display: grid;
        gap: 2em;
      }
      #results-scene [data-board] {
        background: var(--ink);
        box-shadow: 0.4em 0.4em 0 rgb(0 0 0 / 0.4);
      }
      #results-scene [data-board]:empty {
        display: none;
      }
      #results-scene [data-board] li {
        display: grid;
        grid-template-areas: "place swatch name badge lap" "place swatch stops stops stops";
        grid-template-columns: 2.6em 0.8em 1fr auto 6.6em;
        align-items: center;
        column-gap: 0.6em;
        padding: 0.45em 0.8em;
        font-size: 1.3em;
        border-bottom: 0.1em dashed #333;
      }
      #results-scene [data-board] [data-place] {
        grid-area: place;
      }
      #results-scene [data-board] [data-swatch] {
        grid-area: swatch;
        height: 0.8em;
        background: var(--livery);
        outline: 0.1em solid #555;
      }
      #results-scene [data-board] [data-name] {
        grid-area: name;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #results-scene [data-board] [data-fastest-lap] {
        grid-area: badge;
      }
      #results-scene [data-board] [data-best-lap] {
        grid-area: lap;
        text-align: right;
      }
      /* The stops under the name, in the label's grey. */
      #results-scene [data-board] [data-stops] {
        grid-area: stops;
        font-size: 0.75em;
        color: var(--label);
      }
      #results-scene [data-board] li[data-not-finished] {
        color: #888;
      }
      #results-scene [data-board] li[data-you] {
        color: var(--ink);
        background: var(--gold);
      }
      #results-scene [data-podium] {
        grid-area: podium;
        align-self: end;
        display: flex;
        align-items: flex-end;
        gap: 0.6em;
      }
      /* Second, first, third from the left; each step's name tag over its kart over its block. */
      #results-scene [data-podium] li {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        order: 2;
      }
      #results-scene [data-podium] li[data-result="1st"] {
        order: 1;
      }
      #results-scene [data-podium] li[data-result="2nd"] {
        order: 0;
      }
      #results-scene [data-podium] [data-name] {
        order: 0;
        max-width: 100%;
        overflow: hidden;
        padding: 0.15em 0.4em;
        font-size: 1.4em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #results-scene [data-podium] li[data-you] [data-name] {
        color: var(--ink);
        background: var(--gold);
      }
      #results-scene [data-podium] [data-best-lap] {
        order: 1;
        margin-top: 0.3em;
        font-size: 1.1em;
      }
      #results-scene [data-podium] [data-fastest-lap] {
        order: 2;
        margin-top: 0.3em;
      }
      #results-scene [data-podium] [data-stops] {
        order: 2;
        margin-top: 0.3em;
        font-size: 0.85em;
      }
      #results-scene [data-podium] .kart {
        order: 3;
        width: 10em;
        margin: 0.4em 0 -0.2em;
      }
      #results-scene [data-podium] [data-place] {
        order: 4;
        display: grid;
        place-items: center;
        width: 100%;
        height: 1.5em;
        font-size: 3.4em;
        color: #e08a3c;
        background: var(--ink);
        border-top: 0.12em solid currentColor;
        transform-origin: bottom;
      }
      #results-scene [data-podium] li[data-result="1st"] [data-place] {
        height: 3.2em;
        color: var(--gold);
      }
      #results-scene [data-podium] li[data-result="2nd"] [data-place] {
        height: 2.2em;
        color: #ddd;
      }
      #results-scene [data-actions] {
        display: flex;
        justify-content: flex-end;
        gap: 1em;
      }
      #results-scene [data-confetti] {
        position: absolute;
        z-index: 5;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      #results-scene [data-confetti] i {
        position: absolute;
        top: -4%;
        left: var(--x);
        width: 0.9em;
        height: 0.45em;
        background: var(--c);
        rotate: var(--r);
      }
      @keyframes poster-spin {
        to {
          rotate: 360deg;
        }
      }
      @keyframes poster-chequer {
        to {
          background-position: 6em 0;
        }
      }
      @keyframes poster-run {
        to {
          left: 110%;
        }
      }
      @keyframes poster-roll {
        to {
          rotate: 360deg;
        }
      }
      @keyframes poster-stamp {
        from {
          scale: 3;
          opacity: 0;
        }
      }
      @keyframes poster-fade {
        from {
          opacity: 0;
          translate: 0 0.6em;
        }
      }
      @keyframes poster-rise {
        from {
          transform: scaleY(0);
        }
      }
      @keyframes poster-drop {
        from {
          translate: 0 -14em;
          opacity: 0;
        }
      }
      @keyframes poster-fall {
        to {
          transform: translateY(110vh) rotate(540deg) rotateY(720deg);
        }
      }
      /*
       * Motion only for a player who has not asked for less; otherwise
       * everything holds still and the confetti stays away. The reveal is
       * done within 2 s and never holds back the buttons.
       */
      #results-scene [data-confetti] {
        display: none;
      }
      @media (prefers-reduced-motion: no-preference) {
        :is(#title-scene, #room-scene, #results-scene) .rays {
          animation: poster-spin 40s linear infinite;
        }
        :is(#title-scene, #room-scene, #results-scene) :is(.chequer-top, .chequer-bottom) {
          animation: poster-chequer 3s linear infinite;
        }
        :is(#title-scene, #room-scene, #results-scene) .chequer-bottom {
          animation-direction: reverse;
        }
        :is(#title-scene, #room-scene, #results-scene) button {
          transition:
            translate 0.08s,
            box-shadow 0.08s;
        }
        /*
         * The runners drive: the wheels turn with the ground they cover, one
         * turn of the rear wheel per 0.41 s for a 10 em kart crossing a
         * 1440 px window in 5 s, and the front wheel, smaller by build.py's
         * 0.9, that much faster. Forwards is clockwise, the kart facing right.
         */
        #title-scene .runner {
          --roll: 0.41s;
          animation: poster-run 5s linear infinite;
        }
        #title-scene .runner + .runner {
          --roll: 0.33s;
          animation-delay: -2.4s;
        }
        #title-scene .runner .wheel {
          animation: poster-roll var(--roll) linear infinite;
        }
        #title-scene .runner .wheel[data-node^="wheel-front"] {
          animation-duration: calc(var(--roll) * 0.9);
        }
        #results-scene [data-race-over] {
          animation: poster-stamp 0.5s cubic-bezier(0.2, 1.6, 0.4, 1) both;
        }
        #results-scene h1 {
          animation: poster-stamp 0.5s 0.2s cubic-bezier(0.2, 1.6, 0.4, 1) both;
        }
        #results-scene [data-subline] {
          animation: poster-fade 0.4s 0.5s both;
        }
        #results-scene [data-board] li {
          animation: poster-fade 0.3s both;
        }
        #results-scene [data-board] li:nth-child(2) {
          animation-delay: 0.08s;
        }
        #results-scene [data-board] li:nth-child(3) {
          animation-delay: 0.16s;
        }
        #results-scene [data-board] li:nth-child(4) {
          animation-delay: 0.24s;
        }
        #results-scene [data-board] li:nth-child(5) {
          animation-delay: 0.32s;
        }
        /* Third's block rises first and first's last, each kart dropping on 0.3 s into its block's rise. */
        #results-scene [data-podium] [data-place] {
          animation: poster-rise 0.6s 0.5s cubic-bezier(0.2, 1.3, 0.4, 1) both;
        }
        #results-scene [data-podium] .kart {
          animation: poster-drop 0.5s 0.8s cubic-bezier(0.2, 1.5, 0.4, 1) both;
        }
        #results-scene [data-podium] li[data-result="2nd"] [data-place] {
          animation-delay: 0.7s;
        }
        #results-scene [data-podium] li[data-result="2nd"] .kart {
          animation-delay: 1s;
        }
        #results-scene [data-podium] li[data-result="1st"] [data-place] {
          animation-delay: 0.9s;
        }
        #results-scene [data-podium] li[data-result="1st"] .kart {
          animation-delay: 1.2s;
        }
        #results-scene [data-confetti] {
          display: block;
        }
        #results-scene [data-confetti] i {
          animation: poster-fall var(--d) linear var(--delay) infinite;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
