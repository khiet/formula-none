<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Formula None</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #app canvas {
        display: block;
      }
      /*
       * The Instrument panel: 16-bit kart racer type over the View, no box
       * behind it (ADR 0023). One unit scales the whole HUD with the viewport,
       * with a floor so small windows still read. The face is registered by
       * the panel module; the stack after it is the fallback.
       */
      #instrument-panel {
        --hud: max(0.55rem, 1.5vmin);
        --gold: #fde97a;
        --outline: #3a1c0a;
        position: absolute;
        inset: 0;
        pointer-events: none;
        color: var(--gold);
        font-family: "Kenney Mini Square", ui-monospace, SFMono-Regular, Menlo, monospace;
        line-height: 1;
        text-transform: uppercase;
        /* A one-pixel outline on the face's own grid, an eighth of an em, and a two-pixel black drop. */
        text-shadow:
          0.125em 0 var(--outline),
          -0.125em 0 var(--outline),
          0 0.125em var(--outline),
          0 -0.125em var(--outline),
          0.125em 0.125em var(--outline),
          -0.125em 0.125em var(--outline),
          0.125em -0.125em var(--outline),
          -0.125em -0.125em var(--outline),
          0.25em 0.25em #000;
      }
      #instrument-panel [hidden] {
        display: none;
      }
      #instrument-panel [data-label] {
        color: #fff;
      }
      #instrument-panel [data-stack] {
        position: absolute;
        top: calc(var(--hud) * 2);
        left: calc(var(--hud) * 2);
        display: grid;
        gap: calc(var(--hud) * 1.4);
        justify-items: start;
      }
      [data-instrument="position"] {
        font-size: calc(var(--hud) * 6.4);
      }
      [data-instrument="position"] [data-suffix] {
        font-size: 0.4em;
        vertical-align: top;
      }
      [data-instrument="lap"],
      [data-instrument="lap-time"],
      [data-instrument="best-lap"] {
        display: flex;
        align-items: center;
        gap: 0.6em;
        font-size: calc(var(--hud) * 2.4);
        white-space: nowrap;
      }
      [data-instrument="best-lap"] {
        font-size: calc(var(--hud) * 1.8);
      }
      /* Text kept for assistive technology behind the flags and the item sprite. */
      [data-lap-text],
      [data-item-name] {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      [data-flags] {
        display: flex;
        align-items: center;
        gap: 0.5em;
      }
      [data-flags]::before {
        content: "LAP";
        margin-right: 0.6em;
        color: #fff;
      }
      [data-flag] {
        width: 1.6em;
        height: 1.2em;
        background: #4b2c17;
        border: 0.2em solid var(--outline);
        box-shadow: 0.25em 0.25em 0 #000;
      }
      [data-flag="done"] {
        background: conic-gradient(#000 25%, #fff 0 50%, #000 0 75%, #fff 0);
        background-size: 50% 50%;
      }
      [data-instrument="item"] {
        display: grid;
        place-items: center;
        width: 6.2em;
        height: 6.2em;
        font-size: calc(var(--hud) * 1.6);
        text-align: center;
        color: var(--outline);
        text-shadow: none;
        background: linear-gradient(#f8e39a, #c99a2e);
        border: 0.4em solid var(--outline);
        box-shadow:
          inset 0.4em 0.4em 0 #fff6cf,
          inset -0.4em -0.4em 0 #8c5a12,
          0.5em 0.5em 0 #000;
      }
      /* The held item's character (ADR 0024) fills about two thirds of the box and scales with the HUD unit. */
      [data-instrument="item"] svg {
        width: 4.2em;
        height: 4.2em;
        image-rendering: pixelated;
      }
      [data-instrument="item"][data-item-state="firing"] {
        background: #fff;
        animation: item-fire 0.25s steps(2) infinite;
      }
      @keyframes item-fire {
        to {
          background: #c99a2e;
        }
      }
      /*
       * The speed cluster (ADR 0031), bottom-left opposite the course map:
       * shift lights over the gear in a box like the item slot, km/h beside
       * it and the tyre gauge under that.
       */
      #instrument-panel [data-cluster] {
        position: absolute;
        left: calc(var(--hud) * 2);
        bottom: calc(var(--hud) * 2);
        display: grid;
        grid-template-areas: "lights lights" "gear speed" "gear tyre";
        grid-template-columns: auto auto;
        column-gap: calc(var(--hud) * 1.4);
        row-gap: calc(var(--hud) * 0.9);
        align-items: end;
      }
      [data-shift-lights] {
        grid-area: lights;
        display: flex;
        gap: calc(var(--hud) * 0.35);
      }
      [data-shift-light] {
        width: calc(var(--hud) * 1.5);
        height: calc(var(--hud) * 1.5);
        background: #2a1a10;
        border: calc(var(--hud) * 0.25) solid var(--outline);
        box-shadow: calc(var(--hud) * 0.3) calc(var(--hud) * 0.3) 0 #000;
      }
      [data-shift-light="green"] {
        background: #5ad15a;
      }
      [data-shift-light="red"] {
        background: #e8483a;
      }
      [data-shift-light="blue"] {
        background: #4f7dff;
      }
      [data-instrument="gear"] {
        grid-area: gear;
        display: grid;
        place-items: center;
        width: 1.15em;
        height: 1.3em;
        font-size: calc(var(--hud) * 8.4);
        color: var(--outline);
        text-shadow: none;
        background: linear-gradient(#f8e39a, #c99a2e);
        border: calc(var(--hud) * 0.4) solid var(--outline);
        box-shadow:
          inset calc(var(--hud) * 0.4) calc(var(--hud) * 0.4) 0 #fff6cf,
          inset calc(var(--hud) * -0.4) calc(var(--hud) * -0.4) 0 #8c5a12,
          calc(var(--hud) * 0.5) calc(var(--hud) * 0.5) 0 #000;
      }
      /* On the limiter the gear flashes as the item slot does when firing. */
      [data-instrument="gear"][data-limiter="true"] {
        background: #fff;
        animation: item-fire 0.12s steps(2) infinite;
      }
      [data-instrument="speed"] {
        grid-area: speed;
        display: flex;
        align-items: baseline;
        gap: calc(var(--hud) * 0.8);
      }
      [data-speed-value] {
        min-width: 3ch;
        font-size: calc(var(--hud) * 5.2);
        text-align: right;
      }
      [data-speed-unit] {
        font-size: calc(var(--hud) * 1.8);
        color: #fff;
      }
      [data-instrument="tyre"] {
        grid-area: tyre;
        display: flex;
        align-items: center;
        gap: calc(var(--hud) * 1);
        font-size: calc(var(--hud) * 2.2);
      }
      [data-instrument="tyre"] svg {
        width: calc(var(--hud) * 4.2);
        filter: drop-shadow(calc(var(--hud) * 0.25) calc(var(--hud) * 0.25) 0 #000);
      }
      [data-tyre-corner] {
        stroke: var(--outline);
        stroke-width: 1;
      }
      [data-tyre-wear="good"] [data-tyre-corner] {
        fill: #5ad15a;
      }
      [data-tyre-wear="warn"] [data-tyre-corner] {
        fill: #f5c542;
      }
      [data-tyre-wear="bad"] [data-tyre-corner] {
        fill: #e8483a;
      }
      /* Greybox readouts: a dim line of their own, top-right, clear of the course map and the countdown. */
      #instrument-panel [data-greybox] {
        position: absolute;
        right: calc(var(--hud) * 2);
        top: calc(var(--hud) * 2);
        font-size: calc(var(--hud) * 1.2);
        color: rgba(255, 255, 255, 0.55);
        text-transform: none;
        text-shadow: 0.125em 0.125em 0 #000;
      }
      [data-instrument="wrong-way"] {
        position: absolute;
        top: 56%;
        left: 50%;
        transform: translateX(-50%);
        font-size: calc(var(--hud) * 4.2);
        color: #ff5a3c;
        white-space: nowrap;
        animation: blink 0.6s steps(2) infinite;
      }
      @keyframes blink {
        to {
          visibility: hidden;
        }
      }
      [data-instrument="connection-banner"] {
        position: absolute;
        top: calc(var(--hud) * 2);
        left: 50%;
        transform: translateX(-50%);
        padding: 0.6em 1em;
        font-size: calc(var(--hud) * 1.8);
        color: #fff;
        background: #c21c1c;
        white-space: nowrap;
      }
      [data-instrument="countdown"] {
        position: fixed;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 8rem;
      }
      /* The warning, the firing flash and the limiter hold steady for a driver who asked for less motion. */
      @media (prefers-reduced-motion: reduce) {
        [data-instrument="wrong-way"],
        [data-instrument="item"][data-item-state="firing"],
        [data-instrument="gear"][data-limiter="true"] {
          animation: none;
        }
      }
      [data-instrument="course-map"] {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        width: 25vmin;
        height: 25vmin;
        pointer-events: none;
      }
      [data-kart-labels] {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
      }
      /* Sized to read at speed: bold on a dark pill, the livery as a stripe. */
      .kart-label {
        padding: 0.15rem 0.5rem;
        border-left: 0.35rem solid #fff;
        border-radius: 0.3rem;
        background: rgba(0, 0, 0, 0.65);
        color: #fff;
        font: 700 1.05rem/1.2 system-ui, sans-serif;
        letter-spacing: 0.02em;
        text-shadow: 0 0.05rem 0.1rem #000;
        white-space: nowrap;
      }
      #title-scene,
      #room-scene,
      #results-scene {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        height: 100%;
        color: #fff;
        font: 1.25rem/1.4 system-ui, sans-serif;
      }
      #results-scene ol {
        padding: 0;
        list-style: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #title-scene button,
      #room-scene button,
      #results-scene button {
        padding: 0.5rem 1.5rem;
        font: inherit;
        cursor: pointer;
      }
      #title-scene input {
        padding: 0.5rem 0.75rem;
        font: inherit;
        width: 12ch;
      }
      #title-scene input[name="code"] {
        width: 6ch;
        text-transform: uppercase;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .title-row,
      .room-buttons {
        display: flex;
        gap: 0.5rem;
      }
      #title-scene .audio-toggles {
        gap: 1.5rem;
        font-size: 1rem;
        color: #bbb;
      }
      #title-scene .audio-toggles label {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        cursor: pointer;
      }
      #title-scene [data-message] {
        min-height: 1.4em;
        margin: 0;
        color: #ffb347;
      }
      #room-scene [data-room-code] {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.1em;
      }
      #room-scene a {
        color: #9cf;
      }
      #room-scene .players {
        display: grid;
        grid-template-columns: auto auto auto;
        gap: 0.5rem 1rem;
        align-items: center;
        min-width: 24rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #room-scene .players li {
        display: contents;
      }
      #room-scene .livery {
        width: 1.5rem;
        height: 1.5rem;
        border-radius: 50%;
      }
      #room-scene .state {
        color: #bbb;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
