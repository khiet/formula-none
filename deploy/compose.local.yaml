# Overrides for running the stack on a laptop: no CloudWatch, and Caddy
# serves https://localhost with its own local CA instead of Let's Encrypt,
# so the server reads the certificate Caddy's local issuer writes.
#
#   SERVER_IMAGE=formula-none:dev docker compose \
#     -f deploy/compose.yaml -f deploy/compose.local.yaml up
#
# The Caddyfile and client come from the release bundle in the image; see
# deploy/README.md for extracting it first.
services:
  caddy:
    environment:
      SITE_ADDRESS: localhost
    logging:
      driver: local
  server:
    environment:
      TLS_CERT: /data/caddy/certificates/local/localhost/localhost.crt
      TLS_KEY: /data/caddy/certificates/local/localhost/localhost.key
    logging:
      driver: local
