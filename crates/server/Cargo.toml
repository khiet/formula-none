[package]
name = "server"
description = "Authoritative game server: rooms, race ticks, transport."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sim = { path = "../sim" }
protocol = { path = "../protocol" }
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time", "fs", "io-util"] }
serde = { version = "1.0.229", features = ["derive"] }
wtransport = "0.7"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
rand = "0.9"
opentelemetry-prometheus = "0.33"
prometheus = "0.14"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["metrics"] }

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["test-util"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5.3", features = ["util"] }
wtransport = { version = "0.7", features = ["dangerous-configuration"] }
