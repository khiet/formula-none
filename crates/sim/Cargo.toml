[package]
name = "sim"
description = "Deterministic race simulation. Depends on nothing else in this repo."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The sim's own trigonometry goes through libm, as Rapier's does under
# enhanced-determinism, so a platform's libm never changes a rule.
libm = "0.2"
rand_chacha = { version = "0.10", default-features = false }
rapier3d = { version = "0.36", features = ["enhanced-determinism"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The kart readout's TypeScript type is generated from the sim (ADR 0026).
ts-rs = { version = "12", features = ["serde-compat"] }

[lints]
workspace = true
