name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (clippy, nextest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Clippy, warnings as errors
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace --profile ci
      - name: Bridge builds for wasm
        run: cargo build -p bridge --target wasm32-unknown-unknown

  web:
    name: Web (Biome, Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The wrapper, its tests and the app import the generated bindings.
      - name: Build the bridge to wasm
        run: pnpm build:bridge
      # The committed TypeScript types are what the protocol crate generates,
      # the sim's beside the protocol's, or the PR forgot to regenerate them
      # (ADR 0004, ADR 0026). `add -N` makes a new file show in the diff too.
      - name: Generated protocol types are current
        run: |
          pnpm generate:protocol
          git add -N apps/web/src/generated/protocol apps/web/src/generated/sim
          git diff --exit-code -- apps/web/src/generated/protocol apps/web/src/generated/sim
      # The poster kart is projected from the committed kart.glb (ADR 0052);
      # a build.py change that forgot to regenerate it shows here.
      - name: Generated poster kart is current
        run: |
          pnpm generate:poster
          git add -N apps/web/src/generated/kart docs/kart-side.js
          git diff --exit-code -- apps/web/src/generated/kart docs/kart-side.js
      - name: Biome
        run: pnpm lint
      # The layouts' pure-Python checks; CI has no Blender to run the export.
      - name: Track layouts
        run: pnpm test:tracks
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Vitest
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Playwright smoke test
        run: pnpm test:e2e
      # A failed spec leaves its error context and screenshots here; without
      # them a flake on the runner cannot be told apart from a bug.
      - name: Keep the smoke test's results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results
          if-no-files-found: ignore

  replay:
    name: Replay determinism (native vs wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,wasm-pack
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every fixture under assets/replays, held to its recorded hashes by
      # the native build and then by the wasm build (ADR 0002).
      - name: Native replay of the fixtures
        run: cargo nextest run -p sim --test replay --profile ci
      - name: Build the bridge to wasm
        run: pnpm build:bridge
      - name: Wasm replay of the fixtures
        run: pnpm --filter web exec vitest run src/replay.test.ts

  # The deploy job's image build, stopped short of the push, so a broken image
  # fails its PR instead of the deploy after the merge (ADR 0074). Main skips
  # it because the deploy builds the same image there. A skipped need would
  # skip the deploy, so the deploy does not need this job.
  image:
    name: Docker image (linux/arm64)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Merge to main: build the arm64 image, push it to ECR under the commit,
  # run the deploy document on the instance and smoke-test the site (ADR
  # 0016). The role and instance come from repository variables set after
  # `tofu apply` (infra/README.md).
  deploy:
    name: Deploy to formulanone.sushimafia.com
    needs: [rust, web, replay]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/formula-none:${{ github.sha }}
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The smoke test's WebTransport handshake is the probe example in the
      # server crate; built here so the smoke script's retry loop runs it at once.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the WebTransport probe
        run: cargo build --release -p server --example webtransport-probe
      - name: Deploy and smoke-test
        run: deploy/deploy.sh ${{ github.sha }}
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
