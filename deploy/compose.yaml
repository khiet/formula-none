# The stack the deploy document runs on the instance (ADR 0015). The image
# carries this file, the Caddyfile and the built client under /release; the
# document copies that directory out of the pulled image and runs Compose
# from it, so the deployed commit and its stack definition never drift apart.
#
# Caddy terminates TLS with a Let's Encrypt certificate kept in caddy_data
# and serves the client; everything under /api, the WebSocket fallback
# included, is proxied to the server. The server terminates QUIC itself on
# 443 UDP for WebTransport (ADR 0011) with the same certificate, read from
# Caddy's volume: a renewal is a rewrite of those files, which the server
# picks up by itself (deploy/README.md).
#
# Prometheus scrapes the server's metrics over the Compose network and
# Grafana, provisioned from the files beside this one, draws them (ADR
# 0018). Neither is published beyond the instance: Grafana listens on the
# loopback for the SSM port forward in grafana.sh, and Prometheus only on
# the Compose network.
#
# The project name pins the volume names so a deploy from any directory
# finds the same certificate.
name: formula-none

services:
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    # 443 TCP only: HTTP/3 is off (see the Caddyfile) so 443 UDP stays free
    # for the server's own QUIC listener (ADR 0011).
    ports:
      - "443:443/tcp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-formulanone.sushimafia.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: &logging
      driver: awslogs
      options:
        awslogs-region: eu-west-2
        awslogs-group: /formula-none/server
        # One stream per service, continued across restarts.
        tag: "{{.Name}}"
    depends_on:
      - server

  server:
    image: ${SERVER_IMAGE}
    restart: unless-stopped
    # 443 UDP is QUIC for WebTransport; HTTP stays on the Compose network.
    ports:
      - "443:4433/udp"
    environment:
      WEBTRANSPORT_ADDR: 0.0.0.0:4433
      # Where Caddy keeps the certificate it obtained for the site.
      TLS_CERT: /data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${SITE_ADDRESS:-formulanone.sushimafia.com}/${SITE_ADDRESS:-formulanone.sushimafia.com}.crt
      TLS_KEY: /data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${SITE_ADDRESS:-formulanone.sushimafia.com}/${SITE_ADDRESS:-formulanone.sushimafia.com}.key
    volumes:
      - caddy_data:/data:ro
    # Caddy writes its private key readable by root only, so the server runs
    # as root to read it; every capability is dropped and the filesystem is
    # read-only so that uid buys nothing else.
    user: "0:0"
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # Caddy proxies only /api/*, so the server's /metrics is reachable from
  # nowhere but here. Fifteen days or a gigabyte of samples, whichever
  # fills first, on the root volume.
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    logging: *logging
    depends_on:
      - server

  # Whoever reaches the port has already been authenticated by Session
  # Manager, so the login form is off and the viewer is an admin. Nothing
  # persists: the data source and the dashboard are provisioned from the
  # repo on every start.
  grafana:
    image: grafana/grafana:13.2.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    logging: *logging
    depends_on:
      - prometheus

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
