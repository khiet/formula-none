[package]
name = "server"
description = "Authoritative game server: rooms, race ticks, transport."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sim = { path = "../sim" }
protocol = { path = "../protocol" }
axum = "0.8.9"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "net"] }
serde = { version = "1.0.229", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1.0.154"
tower = { version = "0.5.3", features = ["util"] }
