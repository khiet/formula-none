<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Formula None</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #app canvas {
        display: block;
      }
      #instrument-panel {
        position: absolute;
        top: 1rem;
        left: 1rem;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font: 1.25rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      [data-instrument="countdown"] {
        position: fixed;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 8rem;
        font-weight: bold;
        text-shadow: 0 0 1rem #000;
      }
      #title-scene,
      #results-scene {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        height: 100%;
        color: #fff;
        font: 1.25rem/1.4 system-ui, sans-serif;
      }
      #results-scene ol {
        padding: 0;
        list-style: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #title-scene button,
      #results-scene button {
        padding: 0.5rem 1.5rem;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
