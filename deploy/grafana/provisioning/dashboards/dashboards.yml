# Every dashboard is a file from the repo (ADR 0018), mounted read-only
# from deploy/grafana/dashboards; nothing is built by hand in Grafana.
apiVersion: 1
providers:
  - name: formula-none
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
