<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Drift Spark Animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #121316;
    --fg: #e8e8ea;
    --muted: #8a8d94;
    --rule: #2a2c31;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 Inter, system-ui, sans-serif; }
  body { padding: 2rem 16px 4rem; }
  header, main { max-width: 1120px; margin: 0 auto; }
  header { margin-bottom: 1.5rem; }
  h1 { font: 600 1.4rem/1.2 Inter, sans-serif; margin: 0 0 .25rem; }
  header p { margin: 0; color: var(--muted); }
  .controls { display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; margin-top: 1rem; padding: .75rem 1rem; border: 1px solid var(--rule); border-radius: .5rem; }
  .controls label { display: flex; align-items: center; gap: .4rem; cursor: pointer; font-size: .9rem; }
  .controls input { accent-color: #ff8800; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem 1rem; }
  figure { margin: 0; display: grid; gap: .4rem; align-content: start; }
  figure h2 { margin: 0; font: 600 1rem/1.2 Inter, sans-serif; }
  figure h2 small { color: var(--muted); font-weight: 400; margin-left: .4rem; }
  canvas { width: 100%; aspect-ratio: 16 / 9; border-radius: .5rem; display: block; background: #6b6b78; }
  figcaption { font-size: .88rem; color: var(--muted); }
  figcaption b { color: var(--fg); font-weight: 600; }
  code { font: .85em ui-monospace, Menlo, monospace; color: var(--fg); }
</style>
</head>
<body>
<header>
  <h1>Drift spark animation</h1>
  <p>All six use option B's colours: orange tier born <code>#fff0b0</code> cooling to <code>#ff7a00</code>, red tier born <code>#ffd27a</code> cooling to <code>#e01808</code>.
     Each loops one drift: drifting, orange from 0.3 s, red from 0.6 s, release at 1.4 s. Style 1 is today's motion, recoloured.</p>
  <div class="controls">
    <label><input type="checkbox" id="slow" /> Slow motion (x0.25)</label>
    <label><input type="checkbox" id="hold" /> Hold on red</label>
    <label><input type="checkbox" id="dark" /> Night asphalt</label>
  </div>
</header>
<main id="grid"></main>
<script>
  const TIERS = [
    { label: "orange", born: "#fff0b0", dies: "#ff7a00" },
    { label: "red", born: "#ffd27a", dies: "#e01808" },
  ];
  const TIER_1_S = 0.3, TIER_2_S = 0.6, RELEASE_S = 1.4, LOOP_S = 2.2;
  const G = 9.8;
  const base = { rate: 60, speed: 6, spread: 2, riseMin: 1, riseMax: 3, life: 0.25, size: 0.08 };

  // Each style overrides the emitter's numbers and turns on render or motion features.
  const STYLES = [
    {
      name: "1. Cubes", sub: "today's motion",
      note: "Unchanged emitter, recoloured. <b>Cost:</b> colour over life in the particle mesh only.",
      ...base,
    },
    {
      name: "2. Streaks", sub: "stretched along velocity",
      note: "Each spark is drawn as a thin bar from where it was 30 ms ago to where it is, the way a camera smears a grinder's sparks. Reads as speed. <b>Cost:</b> orient and scale each instance along its velocity.",
      ...base, streak: 0.03,
    },
    {
      name: "3. Bounce", sub: "sparks skip off the road",
      note: "Sparks live 0.4 s and bounce once or twice off the asphalt, losing most of their energy, so they scatter behind the kart like real ones. <b>Cost:</b> a ground plane and restitution in particles.ts.",
      ...base, life: 0.4, bounce: 0.45,
    },
    {
      name: "4. Glow", sub: "additive halo",
      note: "Each spark gets a soft halo that adds light rather than covering the road, so dense sparks bloom white-hot at the wheel. <b>Cost:</b> a second additive, depth-write-off sprite per spark.",
      ...base, glow: true,
    },
    {
      name: "5. Tier-up burst", sub: "a pop when a tier charges",
      note: "Today's stream, plus a 20-spark fan thrown faster and wider the frame a tier charges, so the moment it becomes available is felt, not just seen. <b>Cost:</b> the emitter remembers last frame's tier per kart.",
      ...base, burst: 20,
    },
    {
      name: "6. Grinder", sub: "streaks + bounce + glow + burst",
      note: "Everything at once, the heaviest read. Red sparks also throw a little harder (7.5 m/s) and denser (90/s) so the second tier reads as more, not only as different.",
      ...base, life: 0.35, streak: 0.03, bounce: 0.4, glow: true, burst: 20, redBoost: true,
    },
  ];

  const slow = document.getElementById("slow");
  const hold = document.getElementById("hold");
  const dark = document.getElementById("dark");

  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mixRgb = (a, b, t) => { const [x, y] = [hex(a), hex(b)]; return x.map((v, i) => Math.round(v + (y[i] - v) * t)); };

  const grid = document.getElementById("grid");
  const views = STYLES.map((style) => {
    const fig = document.createElement("figure");
    fig.innerHTML = `<h2>${style.name}<small>${style.sub}</small></h2>`;
    const canvas = document.createElement("canvas");
    const cap = document.createElement("figcaption");
    cap.innerHTML = style.note;
    fig.append(canvas, cap);
    grid.append(fig);
    return { style, canvas, sparks: [], owed: 0, clock: 0, lastTier: -1 };
  });

  function project(w, h, x, y, z) {
    const depth = 2.4 - z; // camera 2.4 m behind the rear axle
    const f = h * 0.8 / depth;
    return [w / 2 + x * f, h * 0.42 - (y - 1.3) * f, f];
  }

  function tierAt(t) {
    if (hold.checked) return 1;
    if (t < TIER_1_S || t >= RELEASE_S) return -1;
    return t < TIER_2_S ? 0 : 1;
  }

  function spawn(view, tier, side, speed, spread, riseMax) {
    const s = view.style;
    view.sparks.push({
      p: [side * 0.75, 0.02, 0.1],
      v: [(2 * Math.random() - 1) * spread, s.riseMin + Math.random() * (riseMax - s.riseMin), speed],
      age: 0,
      tier: TIERS[tier],
    });
  }

  function drawKart(ctx, w, h) {
    const box = (x0, y0, z, x1, y1, fill) => {
      const [ax, ay] = project(w, h, x0, y1, z);
      const [bx, by] = project(w, h, x1, y0, z);
      ctx.fillStyle = fill;
      ctx.fillRect(ax, ay, bx - ax, by - ay);
    };
    box(-0.55, 0.12, -0.5, 0.55, 0.42, "#a81e1e");
    box(-0.45, 0.42, -0.6, 0.45, 0.62, "#d62828");
    box(-0.15, 0.62, -0.7, 0.15, 0.95, "#f1c27d");
    for (const side of [-1, 1]) box(side * 0.75 - 0.18, 0, 0, side * 0.75 + 0.18, 0.34, "#1b1b1f");
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05) * (slow.checked ? 0.25 : 1);
    last = now;
    for (const view of views) {
      const { canvas, style } = view;
      const w = canvas.clientWidth * devicePixelRatio, h = canvas.clientHeight * devicePixelRatio;
      if (canvas.width !== w) { canvas.width = w; canvas.height = h; }
      const ctx = canvas.getContext("2d");
      view.clock = (view.clock + dt) % LOOP_S;
      const tier = tierAt(view.clock);
      const red = tier === 1 && style.redBoost;
      const rate = red ? 90 : style.rate;
      const speed = red ? 7.5 : style.speed;

      if (tier >= 0 && tier > view.lastTier && style.burst) {
        for (let i = 0; i < style.burst / 2; i++) {
          for (const side of [-1, 1]) spawn(view, tier, side, 9 + Math.random() * 2, 4, 4.5);
        }
      }
      view.lastTier = tier;
      if (tier >= 0) {
        view.owed = Math.min(view.owed + rate * dt, rate * 0.1);
        for (; view.owed >= 1; view.owed -= 1) {
          for (const side of [-1, 1]) spawn(view, tier, side, speed, style.spread, style.riseMax);
        }
      }
      for (const s of view.sparks) {
        s.age += dt;
        s.v[1] -= G * dt;
        for (let i = 0; i < 3; i++) s.p[i] += s.v[i] * dt;
        if (style.bounce && s.p[1] < 0 && s.v[1] < 0) {
          s.p[1] = 0;
          s.v[1] = -s.v[1] * style.bounce;
          s.v[0] *= 0.7;
          s.v[2] *= 0.7;
        }
      }
      view.sparks = view.sparks.filter((s) => s.age < style.life && s.p[2] < 2.1);

      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = dark.checked ? "#25262c" : "#6b6b78";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = dark.checked ? "#1d3317" : "#4a8c3a";
      ctx.fillRect(0, 0, w, h * 0.12);
      ctx.fillStyle = dark.checked ? "#9a9a9a" : "#f0f0f0";
      ctx.fillRect(w * 0.06, h * 0.12, w * 0.015, h);
      drawKart(ctx, w, h);

      for (const s of view.sparks) {
        const t = s.age / style.life;
        const life = 1 - t;
        const rgb = mixRgb(s.tier.born, s.tier.dies, Math.min(t / 0.8, 1));
        const colour = `rgb(${rgb.join(",")})`;
        const [x, y, f] = project(w, h, s.p[0], Math.max(s.p[1], 0), s.p[2]);
        const size = Math.max(style.size * life * f, 1);
        if (style.glow) {
          ctx.globalCompositeOperation = "lighter";
          const r = size * 3.5;
          const g = ctx.createRadialGradient(x, y, 0, x, y, r);
          g.addColorStop(0, `rgba(${rgb.join(",")},${0.45 * life})`);
          g.addColorStop(1, `rgba(${rgb.join(",")},0)`);
          ctx.fillStyle = g;
          ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
          ctx.globalCompositeOperation = "source-over";
        }
        if (style.streak) {
          const tail = s.p.map((c, i) => c - s.v[i] * style.streak);
          const [tx, ty] = project(w, h, tail[0], Math.max(tail[1], 0), tail[2]);
          ctx.strokeStyle = colour;
          ctx.lineWidth = size * 0.7;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(tx, ty);
          ctx.lineTo(x, y);
          ctx.stroke();
        } else {
          ctx.fillStyle = colour;
          ctx.fillRect(x - size / 2, y - size / 2, size, size);
        }
      }
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "#fff";
      ctx.font = `${Math.round(h * 0.06)}px Silkscreen, monospace`;
      const label = tier < 0 ? (view.clock < TIER_1_S ? "drifting" : "released") : TIERS[tier].label;
      ctx.fillText(label, w * 0.1, h * 0.09);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
